name: deploy-verify
version: 1.0.0
category: tooling

triggers:
  - "/deploy-verify"
  - "deploy and test"
  - "deploy to staging"
  - "verify deployment"
  - "pre-flight check"
  - "deploy pipeline"

inputs:
  - name: project_path
    type: string
    required: false
    description: Project root path (auto-detected from cwd if not provided)
  - name: platform
    type: string
    required: false
    description: Deploy platform override (railway, vercel, convex, replit)
  - name: skip_tests
    type: boolean
    required: false
    description: Skip test suite in pre-flight (use for hotfixes only)
  - name: environment
    type: string
    required: false
    description: Target environment (staging, preview, production)

outputs:
  - name: report
    type: string
    description: Markdown deployment verification report
  - name: deploy_url
    type: string
    description: Deployed preview/staging URL
  - name: status
    type: string
    description: overall_pass | warnings | failed

success_criteria:
  - All critical pre-flight checks pass (tsc, tests, build)
  - Deployment completes and URL is reachable
  - Health check returns 200
  - Critical API endpoints respond correctly
  - Report generated with actionable diagnosis for any failures

run_method:
  type: context
  path: SKILL.md
